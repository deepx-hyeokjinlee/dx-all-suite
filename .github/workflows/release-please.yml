name: public-release
run-name: ${{github.triggering_actor}} - Release ${{github.event.inputs.target_commit}} → deepx/dx-all-suite-public

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Target commit from main to release"
        required: true
      manual_release:
        type: boolean
        description: "Manual release"
        required: false
        default: true

permissions: write-all

env:
  internal_repo: deepx/dx-all-suite
  internal_repo_path: ./_internal
  public_repo: DEEPX-AI/dx-all-suite
  public_repo_path: ./_public

jobs:
  release_and_pr:
    name: release_and_pr
    runs-on: self-hosted
    timeout-minutes: 20
    # disable update flow for dx-all-suite -> dx-runtime -> dx_app
    # outputs:
    #   runtime_has_changes: ${{ steps.dx_runtime_commit.outputs.has_changes }}
    #   compiler_has_changes: ${{ steps.dx_compiler_commit.outputs.has_changes }}
    #   modelzoo_has_changes: ${{ steps.dx_modelzoo_commit.outputs.has_changes }}
    #   release_version: ${{ steps.get_version.outputs.release_version }}
    steps:
      - name: Clean
        run: |
          sudo rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}

      - name: Checkout Internal
        uses: actions/checkout@v4
        with:
          repository: ${{ env.internal_repo }}
          path: ${{ env.internal_repo_path }}
          token: ${{ secrets.GH_DCI_TOKEN }}
          ref: main
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Rebase target commit to main
        run: |
          cd ${{ env.internal_repo_path }}
          git rebase ${{ github.event.inputs.target_commit }}

      - name: Checkout Public
        uses: actions/checkout@v4
        with:
          github-server-url: "https://github.com"
          repository: ${{ env.public_repo }}
          path: ${{ env.public_repo_path }}
          token: ${{ secrets.GC_DCI_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Workspace status
        run: ls -al

      - name: Get release tag
        id: get_version
        run: |
          cd ${{ env.internal_repo_path }}
          release_tag=$(git describe --tags --abbrev=0)
          short_commit=$(echo "${{ github.event.inputs.target_commit }}" | cut -c1-7)
          echo "short_commit=$short_commit" >> $GITHUB_ENV
          RELEASE_VERSION="$release_tag+${{env.release_method}}.$short_commit"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
        env:
          release_method: ${{ github.event.inputs.manual_release == 'true' && 'manual.sha' || 'auto.sha' }}

      - name: Clean public repo
        run: |
          rm -rf ${{env.public_repo_path}}/*
          sudo rm -rf ${{env.public_repo_path}}/.github \
                      ${{env.public_repo_path}}/.gitignore

      - name: Copy Internal
        run: |
          rsync -av ${{env.internal_repo_path}}/ ${{env.public_repo_path}}/ \
                --exclude-from=${{env.exclude_path}}
          cd ${{ env.public_repo_path }}

          # for prevent to delete '.github/workflows, .gitmodules'
          while read -r path; do
            # ignore empty line or comment(#)
            [[ -z "$path" || "$path" =~ ^# ]] && continue

            # git restore for exclude_path
            git restore "$path" 2>/dev/null && echo "[ok] git restore: $path" || echo "[skip] git restore: $path"
          done < ../${{env.exclude_path}}

          git submodule update --init --force

          git status
        env:
          exclude_path: ${{env.internal_repo_path}}/.github/release-excluded

      - name: Remove internal
        run: rm -rf ${{env.internal_repo_path}}

      - name: Change workspace
        run: |
          rsync -av ${{ env.public_repo_path }}/ .
          rm -rf ${{ env.public_repo_path }}

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          title: ${{ env.RELEASE_VERSION }}
          body: ${{ env.RELEASE_VERSION }}
          delete-branch: false
          base: staging
          branch: ${{ env.RELEASE_VERSION }}
          commit-message: ${{ env.RELEASE_VERSION }}
          committer: GitHub <noreply@github.com>
          author: "DX-CI <dci@deepx.ai>"
          token: ${{ secrets.GC_DCI_TOKEN }}

      - name: Merge PR
        if: ${{ github.event.inputs.manual_release == 'false' && steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge --rebase --admin "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GC_DCI_TOKEN }}

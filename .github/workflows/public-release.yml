name: (public-release)

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Target commit from main to release"
        required: true
      manual_release:
        type: boolean
        description: "Manual release"
        required: false
        default: true
      public_repo:
        description: "Public repository to release to (default: DEEPX-AI/dx-all-suite)"
        required: false
        default: "DEEPX-AI/dx-all-suite"

permissions: write-all

jobs:
  call_public_release:
    uses: deepx/do_workflows-central/.github/workflows/public-release.yml@main
    with:
      target_commit: ${{ github.event.inputs.target_commit }}
      manual_release: ${{ github.event.inputs.manual_release }}
      internal_repo: deepx/dx-all-suite
      public_repo: ${{ github.event.inputs.public_repo }}
      submodules: false
    secrets:
      internal_token: ${{ secrets.GH_DCI_TOKEN }}
      public_token: ${{ secrets.GC_DCI_TOKEN }}

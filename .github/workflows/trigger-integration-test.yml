name: trigger-integration-test
run-name: trigger-integration-test

on:
    workflow_dispatch:
    schedule:
      - cron: "0 15 * * 6"  # Every Saturday 15:00 UTC (Sunday 00:00 KST)

permissions: write-all

jobs:
  trigger-integration-test:
    runs-on: self-hosted
    steps:
      - name: Trigger Jenkins Job
        run: |
          curl -H "Content-Type: application/json" \
          -X POST "http://192.168.0.82:8080/jenkins/devops/generic-webhook-trigger/invoke?token=integration-test"
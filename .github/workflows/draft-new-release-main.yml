name: draft-new-release
run-name: "${{github.triggering_actor}} - Draft a new release (${{github.sha}})"

on:
  push:
    branches:
      - main

env:
  USER_EMAIL: dci@deepx.ai
  USER_NAME: dx-ci
  GH_TOKEN: ${{ secrets.GH_DCI_TOKEN }}

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-release:
    runs-on: self-hosted
    if: github.repository == 'deepx/dx-all-suite' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'ci-skip') && !contains(github.event.head_commit.message, 'bump-skip') && !contains(github.event.head_commit.message, 'hotfix')
    steps:
    - name: Clean
      run: |
          sudo rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install GitHub CLI
      run: |
        sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 23F3D4EA75716059
        sudo apt-add-repository https://cli.github.com/packages
        sudo apt update
        sudo apt install gh
    - name: Get version
      run: |
        VERSION=$(grep 'current_version =' .bumpversion.cfg | cut -d ' ' -f 3)
        echo "CURRENT_VERSION=$VERSION" >> $GITHUB_ENV
    - name: Get latest release tag
      run: |
        RELEASE_TAG=$(gh release list --limit 1 | awk '{print $3}')
        if [[ "v$CURRENT_VERSION" == "$RELEASE_TAG" ]]; then
          RELEASE_TAG=$(gh release list --limit 2 | awk 'NR==2 {print $3}')
        fi
        echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
    - name: Print latest tag
      run: |
        echo "The latest tag is ${{ env.RELEASE_TAG }}"
    - name: Set git config
      run: |
        git config --global user.email $USER_EMAIL
        git config --global user.name $USER_NAME
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Build change log
      id: build_change_log
      uses: mikepenz/release-changelog-builder-action@v4
      with:
        baseUrl: "https://gh.deepx.ai/api/v3"
        token: ${{ secrets.GH_DCI_TOKEN }}
        fromTag: ${{ env.RELEASE_TAG }}
        toTag: v${{ env.CURRENT_VERSION }}

    - name: Create release
      uses: ncipollo/release-action@v1
      with:
          tag: v${{ env.CURRENT_VERSION }}
          body: ${{steps.build_change_log.outputs.changelog}}
          generateReleaseNotes : true
          allowUpdates: true
          makeLatest: true

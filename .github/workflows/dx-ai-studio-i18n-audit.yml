name: DX AI Studio I18n Browser Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n-audit:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: dx-ai-studio
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test environment
        shell: bash
        run: |
          if [ ! -x .venv/bin/python ]; then
            python3 -m venv --system-site-packages .venv
          fi
          .venv/bin/python -m pip install -r requirements-ci.txt
      - name: Run I18n browser audit
        shell: bash
        run: VENV_PYTHON="$GITHUB_WORKSPACE/dx-ai-studio/.venv/bin/python" bash scripts/run_ci.sh --browser
name: add-submodule

on:
    workflow_dispatch:
        inputs:
            repo_name:
                description: 'Target Repository Name'
                required: true
            repo_url:
                description: 'Target Repository SSH Url'
                required: true
            repo_branch:
                description: 'Target Repository Branch'
                default: 'main'

permissions: write-all

jobs:
    add_submodule:
        runs-on: self-hosted
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                submodules: recursive
                token: ${{secrets.GH_DCI_TOKEN}}

            - name: Add Submodule
              run: |
                git submodule add -b ${{github.event.inputs.repo_branch}} ${{github.event.inputs.repo_url}} ${{github.event.inputs.repo_name}}
                git submodule update --init --recursive

            - name: Commit Submodule
              uses: stefanzweifel/git-auto-commit-action@v4
              with:
                branch: main
                commit_message: 'ci: Add submodule for ${{ github.event.inputs.repo_name }} [skip ci]'

            
name: update-submodule

on:
  repository_dispatch:
    types:
      - update-submodule

jobs:
  update-submodule:
    runs-on: self-hosted

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          submodules: recursive

      - name: Update submodule
        run: |
          echo "Update submodule ${{ github.event.client_payload.name }} → ${{ github.event.client_payload.sha }}"
          cd ${{ github.event.client_payload.name }}
          git fetch --all && git checkout ${{ github.event.client_payload.sha }}

      - name: Generate Change Log
        run: |
          echo "DATE=$(date +"%Y-%m-%d")" >> $GITHUB_ENV
          ./.github/scripts/stamper.sh

      - name: Commit Submodule
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          branch: main
          commit_message: 'ci(${{env.DATE}}): Update ${{ github.event.client_payload.name }}'
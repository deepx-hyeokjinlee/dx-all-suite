name: remove-submodule

on:
    workflow_dispatch:
        inputs:
            repo_name:
                description: 'Target Repository Name'
                required: true

permissions: write-all

jobs:
    rm_submodule:
        runs-on: self-hosted
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                submodules: recursive
                token: ${{ secrets.GH_DCI_TOKEN }}

            - name: Remove Submodule
              run: |
                git submodule deinit -f ${{ github.event.inputs.repo_name }}
                git rm -f ${{ github.event.inputs.repo_name }}
                rm -rf .git/modules/${{ github.event.inputs.repo_name }}

            - name: Commit Submodule
              uses: stefanzweifel/git-auto-commit-action@v4
              with:
                branch: main
                commit_message: 'ci: Remove submodule for ${{ github.event.inputs.repo_name }} [skip ci]'

            
[pytest]
testpaths = tests

# Optional-dependency and scenario markers. Every marker used anywhere under
# tests/ must be declared here, otherwise pytest emits PytestUnknownMarkWarning
# and `-m` filtering silently matches nothing.
markers =
    requires_node: needs a Node.js toolchain on PATH
    requires_pillow: needs the optional Pillow imaging dependency
    requires_dx_runtime: needs the sibling dx-runtime tree / DEEPX SDK
    external: reaches an external network or service
    smoke: fast subset used for smoke gates
    e2e: end-to-end scenario spanning UI, server, and runtime
    e2e_mock: inference triple-gate against the deterministic fake runner (blocking PR gate)
    e2e_npu: inference triple-gate against real DX-M1 NPU inference (nightly / run-npu label)
    visual: pixel visual-regression against committed screenshot baselines
    help_audit: documentation and help-copy audit
    runtime_lifecycle: fixture-local Managed Runtime Host bootstrap, migration, and rollback scenarios

# NOTE: addopts intentionally stays empty. tests/test_pytest_infra_contract.py
# forbids --maxfail / -x / --ignore here: they truncate collection and would let
# the CI gate report green on a partially-run suite.

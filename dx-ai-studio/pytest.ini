[pytest]
testpaths = tests
markers =
    runtime_lifecycle: fixture-local Managed Runtime Host bootstrap, migration, and rollback scenarios
    e2e: end-to-end integration test that may require installed SDK components
    requires_node: test requires a Node.js runtime
    requires_pillow: test requires the Pillow image library
    requires_dx_runtime: test requires the installed DEEPX runtime
    external: test communicates with an external service or resource
    smoke: fast release smoke test
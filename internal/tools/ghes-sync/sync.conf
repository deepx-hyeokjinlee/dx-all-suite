# ghes-sync.sh configuration — github.com private mirror (src) -> closed-network GHES (dst).
#
# DO NOT put personal values here. Copy sync.override.conf.example to sync.override.conf
# (gitignored, applied on top of this file) and set src_host / branch there — that keeps this
# file out of `git status`. The two required values below are EMPTY on purpose: the tool exits 2
# with a hint until they are set (override file or GHES_SYNC_SRC_HOST / GHES_SYNC_BRANCH env).
#
# Section order = processing order: nested repos BEFORE the parent whose gitlinks point at them.
# Per-repo keys override [defaults]; dst_branch defaults to the same name as branch.
# Auth (private repos, never prompted): GHES_SYNC_SRC_TOKEN (github.com PAT, Contents: read) and
# GHES_SYNC_DST_TOKEN or GH_ENTERPRISE_TOKEN (GHES PAT) — or `gh auth setup-git` per host. See README.

[defaults]
src_host  =                                    # REQUIRED (override) — https://github.com/<YOUR-MIRROR-ORG>  (https only, no SSH)
dst_host  = https://gh.deepx.ai/deepx
branch    =                                    # REQUIRED (override) — your feature branch, e.g. feature/<topic>
pr_base   = main                               # PR target on dst (per-repo override below)
mode      = pr                                 # pr = push + ensure PR · push = push only
cache_dir = ${XDG_CACHE_HOME:-~/.cache}/ghes-sync
gitlink_check = strict                         # strict | warn | off
# reviewers = dci                              # push 가 실제 일어난 PR 에 reviewer 를 (재)요청 — 리뷰 봇(dci)은 push 만으로는 다시 돌지 않음
# reverse_branches = feature/<topic> dev main   # --reverse: same-name branches to bring GHES -> mirror.
#   Default when unset: branch + pr_base + main (per repo, deduplicated). May be set here ([defaults],
#   applies to every repo) AND/OR inside a [repo NAME] section (that repo only; wins over [defaults]).

# dx-runtime 의 submodule 들. dx_rt / dx_rt_npu_linux_driver 는 여기서 수정하지 않지만,
# mirror 가 GHES 의 최신을 받아야 하므로 다른 sub-repo 와 똑같이 sync 한다.
[repo dx_rt_npu_linux_driver]
path = dx-runtime/dx_rt_npu_linux_driver

[repo dx_rt]
path = dx-runtime/dx_rt

# dx_fw 는 예외다: 소스는 GHES 에만 있고, 실제로 쓰는 fw.bin 은 공개 채널
# (github.com/DEEPX-AI/dx_fw) 에만 올라간다 — GHES 에는 그 바이너리가 없다. 즉 mirror sync 의
# 어느 쪽도 올바른 소스가 아니므로 ghes-sync 는 이 repo 를 건드리지 않고(sync = off),
# dev checkout 만 setup_remotes.sh 가 ghcloud remote 로 구성한다.
# (663ff4c 는 "공개 채널은 release export 결과이지 dev remote 가 아니다"라며 ghcloud 를 제거했다.
#  그 원칙은 유지되며, 여기 dx_fw 한 repo 만 예외다 — 되돌리기 전에 이 주석을 읽을 것.)
# dx-runtime 의 dx_fw gitlink 는 GHES commit 이라 ghcloud history 에는 없다 → 아래 dx-runtime
# gitlinks 에 dx_fw 를 넣지 말 것(넣으면 strict 검사가 dx-runtime push 를 영구히 막는다).
[repo dx_fw]
path = dx-runtime/dx_fw
sync = off
ghcloud_url = https://github.com/DEEPX-AI/dx_fw.git
ghcloud_ref = main

[repo dx_app]
path = dx-runtime/dx_app
pr_base = dev

[repo dx_stream]
path = dx-runtime/dx_stream
pr_base = dev

[repo dx-runtime]
path = dx-runtime
gitlinks = dx_rt_npu_linux_driver:dx_rt_npu_linux_driver dx_rt:dx_rt dx_app:dx_app dx_stream:dx_stream

[repo dx-compiler]
path = dx-compiler

# dx-modelzoo carries no .deepx/ harness, but it IS a suite submodule: without a
# section here setup_remotes.sh never visits it and prints nothing for it, which
# reads as "only dx-modelzoo failed". Configured so its remotes follow the same
# ghes/mirror convention and the suite's gitlink for it is validated.
[repo dx-modelzoo]
path = dx-modelzoo

# dx-k8s-device-plugin — a suite submodule since #104. Without a section here the suite's
# gitlink for it is never validated and setup_remotes.sh stays silent about it, which is
# exactly how dx-modelzoo once looked broken.
[repo dx-k8s-device-plugin]
path = dx-k8s-device-plugin

[repo dx-all-suite]
path = .
gitlinks = dx-runtime:dx-runtime dx-compiler:dx-compiler dx-modelzoo:dx-modelzoo dx-k8s-device-plugin:dx-k8s-device-plugin

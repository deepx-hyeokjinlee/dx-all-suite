# ghes-sync.sh configuration — github.com mirror (src) -> closed-network GHES (dst).
# Section order = processing order: nested repos BEFORE the parent whose gitlinks point at them.
# Per-repo keys override [defaults]; dst_branch defaults to the same name as branch.
# Auth (private repos): export GHES_SYNC_SRC_TOKEN (github.com PAT, Contents: read) and
# GHES_SYNC_DST_TOKEN or GH_ENTERPRISE_TOKEN (GHES PAT) — or `gh auth setup-git` per host. See README.

[defaults]
src_host  = https://github.com/deepx-dhyang     # https only: the closed network has no SSH route to github.com
dst_host  = https://gh.deepx.ai/deepx
branch    = feature/dx-agent-dev
pr_base   = main                  # PR target on dst (per-repo override below)
mode      = pr                    # pr = push + ensure PR · push = push only
cache_dir = ${XDG_CACHE_HOME:-~/.cache}/ghes-sync
gitlink_check = strict            # strict | warn | off
# reverse_branches = feature/dx-agent-dev dev main   # --reverse: branches to bring GHES -> mirror (default: branch + pr_base + main)

[repo dx_app]
pr_base = dev

[repo dx_stream]
pr_base = dev

[repo dx-runtime]
gitlinks = dx_app:dx_app dx_stream:dx_stream

[repo dx-compiler]

[repo dx-all-suite]
gitlinks = dx-runtime:dx-runtime dx-compiler:dx-compiler

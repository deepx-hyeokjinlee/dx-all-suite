# ghes-sync.sh configuration — github.com private mirror (src) -> closed-network GHES (dst).
#
# DO NOT put personal values here. Copy sync.override.conf.example to sync.override.conf
# (gitignored, applied on top of this file) and set src_host / branch there — that keeps this
# file out of `git status`. The two required values below are EMPTY on purpose: the tool exits 2
# with a hint until they are set (override file or GHES_SYNC_SRC_HOST / GHES_SYNC_BRANCH env).
#
# Section order = processing order: nested repos BEFORE the parent whose gitlinks point at them.
# Per-repo keys override [defaults]; dst_branch defaults to the same name as branch.
# Auth (private repos, never prompted): GHES_SYNC_SRC_TOKEN (github.com PAT, Contents: read) and
# GHES_SYNC_DST_TOKEN or GH_ENTERPRISE_TOKEN (GHES PAT) — or `gh auth setup-git` per host. See README.

[defaults]
src_host  =                                    # REQUIRED (override) — https://github.com/<YOUR-MIRROR-ORG>  (https only, no SSH)
dst_host  = https://gh.deepx.ai/deepx
branch    =                                    # REQUIRED (override) — your feature branch, e.g. feature/<topic>
pr_base   = main                               # PR target on dst (per-repo override below)
mode      = pr                                 # pr = push + ensure PR · push = push only
cache_dir = ${XDG_CACHE_HOME:-~/.cache}/ghes-sync
gitlink_check = strict                         # strict | warn | off
# reverse_branches = feature/<topic> dev main   # --reverse: branches to bring GHES -> mirror (default: branch + pr_base + main)

[repo dx_app]
path = dx-runtime/dx_app
pr_base = dev

[repo dx_stream]
path = dx-runtime/dx_stream
pr_base = dev

[repo dx-runtime]
path = dx-runtime
gitlinks = dx_app:dx_app dx_stream:dx_stream

[repo dx-compiler]
path = dx-compiler

[repo dx-all-suite]
path = .
gitlinks = dx-runtime:dx-runtime dx-compiler:dx-compiler
